name: serial_dashboard
description: "Real-time serial data visualization dashboard for Heritage H2GP"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  hooks_riverpod: ^2.4.9
  flutter_hooks: ^0.20.3
  
  # Charts
  fl_chart: ^0.66.0
  
  # Routing
  go_router: ^12.1.3
  
  # Utilities
  intl: ^0.19.0
  csv: ^6.0.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
